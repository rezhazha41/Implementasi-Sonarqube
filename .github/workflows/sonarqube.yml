name: Flutter static analysis (SonarQube)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Flutter tests and SonarQube scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout analysis configuration
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout Perpus source
        uses: actions/checkout@v4
        with:
          repository: rezhazha41/apps-perpus
          ref: main
          path: perpus-source
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      - name: Install dependencies
        working-directory: perpus-source/apps/mobile
        run: flutter pub get

      - name: Analyze Dart and Flutter code
        working-directory: perpus-source/apps/mobile
        run: flutter analyze --no-pub

      - name: Run Flutter tests and collect LCOV coverage
        working-directory: perpus-source/apps/mobile
        run: flutter test --no-pub --coverage

      - name: Verify SonarQube configuration
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_HOST_URL" ]; then
            echo "::error::Configure the SONAR_HOST_URL repository variable."
            exit 1
          fi
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error::Configure the SONAR_TOKEN repository secret."
            exit 1
          fi

      - name: Scan with SonarQube
        uses: SonarSource/sonarqube-scan-action@v8.3.0
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
