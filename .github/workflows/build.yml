name: Build
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # --- Tambahan untuk apps-perpus (tidak ada di template SonarCloud) ---
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable

      - name: Flutter pub get + analyze + test dengan coverage
        run: |
          cd apps/mobile
          flutter pub get
          flutter analyze
          # Test golden (design_capture, tag 'golden') di-skip di CI: golden
          # digenerate di Windows, render Linux CI beda ~1,83% (run #3,
          # AUTH-01-welcome.png, 5258px diff). Lokal tetap jalan dengan
          # `flutter test` biasa (tanpa --exclude-tags).
          flutter test --coverage --exclude-tags golden
          cd ../..
      # --- Akhir tambahan ---

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
